<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1160" role="img" aria-labelledby="title desc">
  <title id="title">Simplified PRISM research pipeline</title>
  <desc id="desc">Historical DICE data and new Apple and AMD evidence are standardized, modeled with static and guarded adaptive micro-twins, checked against a development reliability gate, and only then admitted to a one-time locked test.</desc>

  <style>
    .canvas { fill: #f8fafc; }
    .title { fill: #0f172a; font: 700 50px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .subtitle { fill: #475569; font: 400 25px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 3; }
    .dice { fill: #f5f3ff; stroke: #8b5cf6; }
    .apple { fill: #eff6ff; stroke: #3b82f6; }
    .amd { fill: #fff7ed; stroke: #f97316; }
    .semantic { fill: #ecfeff; stroke: #0891b2; stroke-width: 4; }
    .model { fill: #eef2ff; stroke: #4f46e5; stroke-width: 4; }
    .gate { fill: #fff7ed; stroke: #ea580c; stroke-width: 4; }
    .locked { fill: #f1f5f9; stroke: #64748b; stroke-width: 4; stroke-dasharray: 12 8; }
    .source-title { fill: #0f172a; font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .source-copy { fill: #475569; font: 500 23px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .stage-title { fill: #0f172a; font: 700 36px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .stage-copy { fill: #334155; font: 500 25px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .note { fill: #64748b; font: 600 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .status { fill: #c2410c; font: 700 23px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .arrow { fill: none; stroke: #64748b; stroke-width: 5; marker-end: url(#arrow); }

    @media (prefers-color-scheme: dark) {
      .canvas { fill: #0d1117; }
      .title, .source-title, .stage-title { fill: #f0f6fc; }
      .subtitle, .source-copy, .stage-copy { fill: #b1bac4; }
      .note { fill: #8c959f; }
      .card { fill: #161b22; stroke: #30363d; }
      .dice { fill: #211a36; stroke: #a78bfa; }
      .apple { fill: #10243e; stroke: #60a5fa; }
      .amd { fill: #352012; stroke: #fb923c; }
      .semantic { fill: #0e2f36; stroke: #22d3ee; }
      .model { fill: #1e1b4b; stroke: #818cf8; }
      .gate { fill: #431f0c; stroke: #fb923c; }
      .locked { fill: #161b22; stroke: #8c959f; }
      .status { fill: #fdba74; }
      .arrow { stroke: #8c959f; }
    }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="canvas" width="1200" height="1160" rx="28"/>
  <text class="title" x="60" y="72">PRISM research pipeline</text>
  <text class="subtitle" x="60" y="112">Three evidence sources → one portable method → one honest final test</text>

  <g aria-label="Historical DICE baseline">
    <rect class="card dice" x="60" y="155" width="330" height="135" rx="18"/>
    <text class="source-title" x="225" y="205" text-anchor="middle">DICE baseline</text>
    <text class="source-copy" x="225" y="248" text-anchor="middle">Historical Apple data</text>
    <text class="note" x="225" y="276" text-anchor="middle">comparison only</text>
  </g>

  <g aria-label="New Apple evidence">
    <rect class="card apple" x="435" y="155" width="330" height="135" rx="18"/>
    <text class="source-title" x="600" y="205" text-anchor="middle">Apple M2 Pro</text>
    <text class="source-copy" x="600" y="248" text-anchor="middle">New PRISM evidence</text>
    <text class="note" x="600" y="276" text-anchor="middle">macOS</text>
  </g>

  <g aria-label="New AMD evidence">
    <rect class="card amd" x="810" y="155" width="330" height="135" rx="18"/>
    <text class="source-title" x="975" y="205" text-anchor="middle">AMD EPYC</text>
    <text class="source-copy" x="975" y="248" text-anchor="middle">New PRISM evidence</text>
    <text class="note" x="975" y="276" text-anchor="middle">Linux</text>
  </g>

  <path class="arrow" d="M225 290 C225 325 420 315 520 345"/>
  <path class="arrow" d="M600 290 V340"/>
  <path class="arrow" d="M975 290 C975 325 780 315 680 345"/>

  <g aria-label="Stage 1 standardize telemetry">
    <rect class="semantic" x="120" y="345" width="960" height="145" rx="20"/>
    <text class="stage-title" x="600" y="397" text-anchor="middle">1 · Standardize telemetry</text>
    <text class="stage-copy" x="600" y="442" text-anchor="middle">Compute · memory · I/O · thermal/power · availability</text>
    <text class="note" x="600" y="475" text-anchor="middle">Unavailable sensors stay missing; values are never invented.</text>
  </g>

  <path class="arrow" d="M600 490 V540"/>

  <g aria-label="Stage 2 learn and monitor">
    <rect class="model" x="120" y="545" width="960" height="165" rx="20"/>
    <text class="stage-title" x="600" y="600" text-anchor="middle">2 · Learn normal behavior and monitor change</text>
    <text class="stage-copy" x="600" y="648" text-anchor="middle">Static control + robust guarded adaptive VAR</text>
    <text class="note" x="600" y="686" text-anchor="middle">Sequential evidence reports false alerts, detection, and delay.</text>
  </g>

  <path class="arrow" d="M600 710 V760"/>

  <g aria-label="Stage 3 development reliability gate">
    <rect class="gate" x="120" y="765" width="960" height="165" rx="20"/>
    <text class="stage-title" x="600" y="820" text-anchor="middle">3 · Pass the development reliability gate</text>
    <text class="stage-copy" x="600" y="868" text-anchor="middle">≤ 0.25 false alerts/hour AND ≥ 50% detection</text>
    <text class="status" x="600" y="906" text-anchor="middle">Current status: CLOSED — continue development only</text>
  </g>

  <path class="arrow" d="M600 930 V980"/>

  <g aria-label="Stage 4 method freeze, locked test, and paper results">
    <rect class="locked" x="120" y="985" width="960" height="130" rx="20"/>
    <text class="stage-title" x="600" y="1038" text-anchor="middle">4 · After a pass: freeze → test once → report</text>
    <text class="stage-copy" x="600" y="1083" text-anchor="middle">Locked Apple/EPYC evidence becomes the paper’s final result.</text>
  </g>
</svg>
