name: Reviewer artifact reproduction

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12']
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: reproduction/requirements-reviewer.txt
      - run: python -m pip install -r reproduction/requirements-reviewer.txt
      - run: python reproduction/reproduce.py --verify-only
      - run: python -m unittest discover -s reproduction -p 'test_reviewer.py'
      - run: python reproduction/reproduce.py --output reviewer-output
      - uses: actions/upload-artifact@v4
        with:
          name: reviewer-results-${{ matrix.os }}-py${{ matrix.python }}
          path: reviewer-output/
          if-no-files-found: error
