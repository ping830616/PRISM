[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-slm"
version = "0.1.0"
description = "Platform-robust in-field sequential monitoring research scaffold"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "psutil>=5.9",
]

[project.optional-dependencies]
notebook = [
  "jupyterlab>=4",
  "nbclient>=0.10",
  "nbformat>=5",
]

[tool.setuptools]
packages = []
