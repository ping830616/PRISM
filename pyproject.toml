[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-slm"
version = "0.1.0"
description = "Practical reliability investigation of sequential host monitoring for silicon lifecycle management"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "psutil>=5.9",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
notebook = [
  "jupyterlab>=4",
  "matplotlib>=3.8",
  "nbclient>=0.10",
  "nbformat>=5",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "scipy>=1.11",
]

[tool.setuptools]
packages = []
